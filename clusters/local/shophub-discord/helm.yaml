apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: shophub-discord
  namespace: flux-system
spec:
  interval: 10m
  url: oci://ghcr.io/nikola031ue/charts/shophub-discord
  ref:
    tag: "0.2.0"
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: shophub-discord
  namespace: flux-system
spec:
  interval: 10m
  releaseName: shophub-discord
  # In the operator namespace since shop-operator 0.3.0, which reconciles DiscordChannels only
  # there and in the shops namespace (spec 004 research R4).
  targetNamespace: shop-operator-system
  install:
    createNamespace: true
  chartRef:
    kind: OCIRepository
    name: shophub-discord
  dependsOn:
    - name: shop-operator
  valuesFrom:
    - kind: ConfigMap
      name: shophub-discord-values
      valuesKey: values.yaml
