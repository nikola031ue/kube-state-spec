name: setup-tools
description: Install pinned CI tools (helm, yq, jq, kubeconform, bats)
runs:
  using: composite
  steps:
    - name: Install tools
      shell: bash
      env:
        HELM_VERSION: v3.17.3
        YQ_VERSION: v4.45.1
        KUBECONFORM_VERSION: v0.6.7
        BATS_VERSION: v1.11.1
      run: |
        set -euo pipefail
        bin="$HOME/.local/bin"; mkdir -p "$bin"; echo "$bin" >> "$GITHUB_PATH"
        curl -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" | tar -xz -C /tmp
        install /tmp/linux-amd64/helm "$bin/helm"
        curl -fsSL -o "$bin/yq" "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
        chmod +x "$bin/yq"
        curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | tar -xz -C "$bin" kubeconform
        curl -fsSL "https://github.com/bats-core/bats-core/archive/refs/tags/${BATS_VERSION}.tar.gz" | tar -xz -C /tmp
        sudo /tmp/bats-core-${BATS_VERSION#v}/install.sh /usr/local
        command -v jq >/dev/null || sudo apt-get install -y jq
        helm version --short; yq --version; kubeconform -v; bats --version; jq --version
