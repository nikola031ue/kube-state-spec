apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: shop-operator
  namespace: flux-system
spec:
  interval: 10m
  url: oci://ghcr.io/nikola031ue/charts/shop-operator
  ref:
    tag: "0.2.0"
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: shop-operator
  namespace: flux-system
spec:
  interval: 10m
  releaseName: shop-operator
  targetNamespace: shop-operator-system
  dependsOn:
    - name: cnpg
    - name: redis-operator
  install:
    createNamespace: true
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  chartRef:
    kind: OCIRepository
    name: shop-operator
  valuesFrom:
    - kind: ConfigMap
      name: shop-operator-values
      valuesKey: values.yaml
