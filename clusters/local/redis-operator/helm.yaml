apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: redis-operator
  namespace: flux-system
spec:
  interval: 10m
  # Upstream chart: allowed only at the exact version in .github/upstream-charts.yaml.
  url: oci://ghcr.io/ot-container-kit/charts/redis-operator
  ref:
    tag: "0.27.0"
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: redis-operator
  namespace: flux-system
spec:
  interval: 10m
  releaseName: redis-operator
  targetNamespace: redis-operator
  install:
    createNamespace: true
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  chartRef:
    kind: OCIRepository
    name: redis-operator
  valuesFrom:
    - kind: ConfigMap
      name: redis-operator-values
      valuesKey: values.yaml
