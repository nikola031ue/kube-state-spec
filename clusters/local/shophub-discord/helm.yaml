apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: shophub-discord
  namespace: flux-system
spec:
  interval: 10m
  url: oci://ghcr.io/nikola031ue/charts/shophub-discord
  ref:
    tag: "0.2.0"
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: shophub-discord
  namespace: flux-system
spec:
  interval: 10m
  releaseName: shophub-discord
  targetNamespace: shophub
  install:
    createNamespace: true
  chartRef:
    kind: OCIRepository
    name: shophub-discord
  dependsOn:
    - name: shophub
  valuesFrom:
    - kind: ConfigMap
      name: shophub-discord-values
      valuesKey: values.yaml
