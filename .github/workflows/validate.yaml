name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  layout:
    name: layout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-tools
      - name: Check Requirement 5.3 layout
        run: bash .github/scripts/check-layout.sh
      - name: Test layout checker
        run: bats .github/tests/check-layout.bats

  schema:
    name: schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-tools
      - name: Validate cluster.yaml / helm.yaml / values.yaml
        run: bash .github/scripts/check-schema.sh
      - name: Test schema checker
        run: bats .github/tests/check-schema.bats

  pairing:
    name: pairing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-tools
      - name: shop-operator chart >= 0.5.0 only with ShopHub >= 0.3.0 (spec 005 T024)
        run: bash .github/scripts/check-pairing.sh
      - name: Test pairing checker
        run: bats .github/tests/check-pairing.bats

  secrets-scan:
    name: secrets-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-tools
      - name: No literal secrets in values.yaml (FR-013)
        run: bash .github/scripts/scan-secrets.sh clusters/*/*/values.yaml
      - name: Test secrets scanner
        run: bats .github/tests/scan-secrets.bats

  charts-exist:
    name: charts-exist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-tools
      - name: Every pinned chart version is pullable anonymously (SC-005)
        run: |
          set -euo pipefail
          source .github/scripts/lib.sh
          failed=0
          for h in clusters/*/*/helm.yaml; do
            url="$(yq_doc "$h" OCIRepository .spec.url)"
            tag="$(yq_doc "$h" OCIRepository .spec.ref.tag)"
            if helm show chart "$url" --version "$tag" >/dev/null 2>&1; then
              echo "ok: $url:$tag"
            else
              echo "::error file=$h::$url:$tag is not anonymously pullable (unpublished or private)"
              failed=1
            fi
          done
          exit $failed

  render:
    name: render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-tools
      - name: Render every release with its values.yaml
        run: |
          set -euo pipefail
          source .github/scripts/lib.sh
          for h in clusters/*/*/helm.yaml; do
            dir="$(dirname "$h")"
            url="$(yq_doc "$h" OCIRepository .spec.url)"
            tag="$(yq_doc "$h" OCIRepository .spec.ref.tag)"
            rel="$(yq_doc "$h" HelmRelease .spec.releaseName)"
            ns="$(yq_doc "$h" HelmRelease .spec.targetNamespace)"
            echo "::group::$dir"
            helm template "$rel" "$url" --version "$tag" -n "$ns" -f "$dir/values.yaml" > /tmp/out.yaml
            kubeconform -strict -ignore-missing-schemas -summary < /tmp/out.yaml
            bash .github/scripts/check-images.sh < /tmp/out.yaml
            echo "::endgroup::"
          done
      - name: Test image checker
        run: bats .github/tests/check-images.bats

  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-tools
      - name: bring-up.sh unit tests (stubbed helm/kubectl)
        run: |
          chmod +x .github/tests/stubs/* bring-up.sh
          bats .github/tests/bring-up.bats

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-tools
      - uses: helm/kind-action@v1.12.0
        with:
          version: v0.27.0
          cluster_name: ci
      - name: Make the kind context look like the local cluster (exercises the FR-021 guard)
        run: |
          kubectl config rename-context kind-ci docker-desktop
          kubectl config use-context docker-desktop
      - name: kind has no LoadBalancer — run Traefik as NodePort in CI only
        # helm --wait would wait forever for a LoadBalancer address. The working-copy edit is
        # never committed; Docker Desktop keeps the LoadBalancer from values.yaml.
        run: yq -i '.service.spec.type = "NodePort"' clusters/local/traefik/values.yaml
      - name: Missing TLS Secret stops bring-up before any release (exit 7)
        run: |
          chmod +x bring-up.sh
          set +e; ./bring-up.sh > /tmp/run0.txt 2>&1; rc=$?; set -e
          cat /tmp/run0.txt
          [ "$rc" -eq 7 ] || { echo "expected exit 7, got $rc"; exit 1; }
          grep -q "mkcert" /tmp/run0.txt
          [ "$(helm list -A -q | wc -l)" -eq 0 ] || { echo "a release was installed"; exit 1; }
      - name: Create a throwaway TLS Secret (CI only; locally it comes from mkcert)
        run: |
          set -euo pipefail
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=shophub.localhost" \
            -addext "subjectAltName=DNS:shophub.localhost,DNS:*.shops.localhost" \
            -keyout "$RUNNER_TEMP/tls.key" -out "$RUNNER_TEMP/tls.crt" 2>/dev/null
          kubectl create namespace traefik
          kubectl create secret tls shophub-tls -n traefik \
            --cert="$RUNNER_TEMP/tls.crt" --key="$RUNNER_TEMP/tls.key"
          rm "$RUNNER_TEMP/tls.key" "$RUNNER_TEMP/tls.crt"
      - name: First bring-up installs every release
        run: |
          set -euo pipefail
          ./bring-up.sh | tee /tmp/run1.txt
          grep -q "done: 6 installed, 0 upgraded, 0 unchanged" /tmp/run1.txt
      - name: Traefik serves the default certificate and redirects HTTP
        run: |
          set -euo pipefail
          kubectl -n traefik port-forward svc/traefik 18080:80 18443:443 >/dev/null 2>&1 &
          sleep 3
          code="$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: shophub.localhost' http://127.0.0.1:18080/)"
          [ "$code" = 301 ] || [ "$code" = 308 ] || { echo "expected a permanent redirect, got $code"; exit 1; }
          echo | openssl s_client -connect 127.0.0.1:18443 -servername shophub.localhost 2>/dev/null \
            | openssl x509 -noout -subject | grep -q "shophub.localhost"
          # headless traefik-proxies resolves to the Traefik pod IP (1st Address line is the DNS server)
          n="$(kubectl run dnsprobe --image=busybox:1.36 --restart=Never --rm -i --quiet -- \
            nslookup traefik-proxies.traefik.svc.cluster.local | grep -c '^Address')"
          [ "$n" -ge 2 ] || { echo "traefik-proxies did not resolve to a pod IP"; exit 1; }
      - name: Second bring-up changes nothing (SC-003)
        run: |
          set -euo pipefail
          ./bring-up.sh | tee /tmp/run2.txt
          grep -q "done: 0 installed, 0 upgraded, 6 unchanged" /tmp/run2.txt
          revs="$(helm history shophub -n shophub -o json | jq length)"
          [ "$revs" -eq 1 ] || { echo "shophub has $revs revisions, expected 1"; exit 1; }
      - name: Wrong context is refused (FR-021)
        run: |
          kubectl config rename-context docker-desktop other
          kubectl config use-context other
          set +e; ./bring-up.sh; rc=$?; set -e
          [ "$rc" -eq 4 ] || { echo "expected exit 4, got $rc"; exit 1; }
